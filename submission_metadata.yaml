# ============================================================================
# AI tools declaration
# ============================================================================
ai_tools_used:
  - "Claude"

ai_usage_summary: |
  Used Claude (Anthropic) as a development collaborator throughout: exploring
  the candidates.jsonl dataset to identify the two honeypot signatures used in
  src/scoring.py::detect_honeypot (expert-proficiency-with-zero-duration skills,
  and years_of_experience mismatched against summed career_history duration),
  reviewing scoring.py and rank.py for bugs, and structuring this repo's README
  and metadata. Claude caught two real bugs during review: (1) a tie-break bug
  where sorting by an unrounded float score before writing the rounded value
  to CSV could produce validator-rejected ties, fixed by rounding before sort;
  (2) a reasoning-text bug that incorrectly labeled an India-based candidate's
  location as "outside India" because the text branched on the location score
  band instead of the actual country field. All scoring logic, rule design,
  and weight choices are our own; no candidate data was sent to any external
  LLM API as part of the ranking pipeline itself — rank.py makes zero network
  calls (verified with grep across src/ and rank.py).

# ============================================================================
# Approach summary
# ============================================================================
methodology_summary: |
  Rule-based ranker, no embeddings/LLM calls, pure Python stdlib. Five
  interpretable component scores — title_fit (0.32), career_substance (0.23,
  phrase-matches career_history descriptions for evidence of having built
  retrieval/ranking/recommendation systems, not just listed them as skills),
  skills_trust (0.23, skills discounted by an endorsement+duration trust
  factor so "expert" claims with 0 months/0 endorsements count for little),
  experience_band (0.12, soft-scored around the JD's 5-9yr range), and
  location (0.10, full credit for Pune/Noida, partial for other JD-named
  cities, scaled by relocation willingness elsewhere). Combined into a base
  score, then multiplied by a behavioral-availability modifier built from
  redrob_signals (recency, response rate, open_to_work, interview completion)
  and by penalty multipliers (0.05x) for two honeypot integrity checks and
  (0.15x) for two hard disqualifiers named explicitly in the JD (consulting-
  only career history; CV/speech/robotics-only skills with no NLP/IR
  exposure). Runtime: ~13 seconds, ~1.3GB peak RAM for the full 100K pool.
  0 honeypots surfaced in the top 100.

