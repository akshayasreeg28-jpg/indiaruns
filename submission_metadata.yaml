# ============================================================================
# AI tools declaration
# ============================================================================
ai_tools_used:
  - "Claude"

ai_usage_summary: |
  Used Claude (Anthropic) as a development collaborator throughout: exploring
  the candidates.jsonl dataset to identify honeypot signatures (and to rule
  out several false leads — date-logic violations, education-timeline gaps,
  salary min/max inversions, company-founding-date violations — none of which
  turned out to be real signals in this dataset), calibrating detection
  thresholds against the actual data distribution rather than guesswork,
  reviewing scoring.py and rank.py for bugs, and structuring this repo's
  README and metadata. Claude caught three real bugs during review: (1) a
  tie-break bug where sorting by an unrounded float score before writing the
  rounded value to CSV could produce validator-rejected ties; (2) a
  reasoning-text bug that incorrectly labeled an India-based candidate's
  location as "outside India" because the text branched on the location
  score band instead of the actual country field; (3) a scoring-formula bug
  in skills_trust where a guaranteed 0.5 floor meant a fabricated "expert,
  0 months used" skill claim scored higher than a genuinely-evidenced lower-
  proficiency skill — the opposite of the function's purpose; (4) a title-
  classification gap, found by exhaustively checking score_title_fit against
  every one of the dataset's 49 distinct job titles (a fixed vocabulary, not
  freeform text) — "AI Specialist" and "Computer Vision Engineer" were
  falling to the same 0.05 floor as unrelated titles like "Civil Engineer",
  burying real AI/ML practitioners. Fixed with a new title tier; verified
  the 3 resulting ranking changes were genuine improvements. All scoring
  logic, rule design, and weight choices are our own; no candidate data was
  sent to any external LLM API as part of the ranking pipeline itself —
  rank.py makes zero network calls (verified with grep across src/ and rank.py).

# ============================================================================
# Approach summary
# ============================================================================
methodology_summary: |
  Rule-based ranker, no embeddings/LLM calls, pure Python stdlib. Five
  interpretable component scores — title_fit (0.32), career_substance (0.23,
  phrase-matches career_history descriptions for evidence of having built
  retrieval/ranking/recommendation systems, not just listed them as skills),
  skills_trust (0.23, skills discounted by a multiplicative endorsement+
  duration evidence factor with no guaranteed floor, so a fabricated "expert"
  claim with 0 months/0 endorsements scores near zero rather than getting
  automatic partial credit), experience_band (0.12, soft-scored around the
  JD's 5-9yr range, floor raised to 0.35 per the JD's explicit "range not a
  requirement" language), and location (0.10, full credit for Pune/Noida,
  high credit for the JD's other named cities, a distinct Tier-1-Indian-city
  tier for Bangalore/Chennai/Kolkata/Ahmedabad per the JD's separate
  Tier-1-city invitation, scaled by relocation willingness elsewhere).
  Combined into a base score, then multiplied by a behavioral-availability
  modifier built from redrob_signals (recency, response rate, open_to_work,
  interview completion) and by penalty multipliers for three named risk
  categories: two honeypot integrity checks (0.05x — expert-proficiency-with-
  zero-duration, and years-of-experience vs. career-history mismatch, both
  thresholds calibrated against the actual distribution rather than guessed),
  two hard disqualifiers (0.15x — consulting-only career history; CV/speech/
  robotics-only skills with no NLP/IR exposure), and a softer title-chasing
  penalty (0.55x — escalating seniority titles with short average tenure,
  matching the JD's milder "not a fit" language for this specific criterion).
  Runtime: ~13-21 seconds, ~1.3GB peak RAM for the full 100K pool, verified
  on a 1-CPU-core/4GB sandbox (well under the 5min/16GB budget with margin
  to spare). 0 honeypots surfaced in the top 100; 70 honeypots and 0 hard-
  disqualified candidates detected pool-wide.

